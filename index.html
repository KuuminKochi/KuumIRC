<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8d8d8">
  <meta name="description" content="A small IRC client for your own network.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>KuumIRC</title>
  <script src="./render.js" defer></script>
  <script src="./client.js" defer></script>
</head>
<body>
  <div class="app">
    <main class="workspace">
      <ol id="messages" role="log" aria-label="Channel messages" aria-live="polite" aria-relevant="additions"><li class="event">Connect to start chatting.</li></ol>
      <aside class="member-pane" aria-label="Channel members"><ul id="members"></ul></aside>
    </main>
    <form id="message-form" class="composer"><label for="message" class="visually-hidden">Message</label><input id="message" placeholder="Message #lobby" maxlength="400" autocomplete="off" disabled><button id="send-button" type="submit" disabled>Send</button></form>
    <footer>
      <details id="connection"><summary>Connect</summary>
        <form id="connect-form" autocomplete="off">
          <label for="username">Username</label><input id="username" name="username" autocomplete="username" required placeholder="alice" maxlength="32">
          <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
          <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
          <label for="channel">Channel</label><input id="channel" name="channel" required value="#lobby" maxlength="64" spellcheck="false">
          <div class="connect-actions"><button type="submit" id="connect-button">Connect</button><button type="button" id="register-button">Register</button></div>
        </form>
      </details>
      <nav id="channels" class="channels" aria-label="Channels"></nav>
      <button id="join-toggle" type="button" aria-label="Join channel" hidden>+</button>
      <form id="join-form" hidden><label for="join-channel" class="visually-hidden">Channel to join</label><input id="join-channel" placeholder="#channel" maxlength="64"><button type="submit">Join</button></form>
      <span id="status" role="status">Not connected</span>
      <button id="disconnect-button" type="button" hidden>Sign out</button>
    </footer>
  </div>
</body>
</html>
